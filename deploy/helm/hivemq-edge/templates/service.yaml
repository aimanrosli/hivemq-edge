apiVersion: v1
kind: Service
metadata:
  name: {{ include "hivemq-edge.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "hivemq-edge.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: mqtt
      port: {{ .Values.service.mqttPort }}
      targetPort: mqtt
      protocol: TCP
    - name: http-ui
      port: {{ .Values.service.httpPort }}
      targetPort: http-ui
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "hivemq-edge.name" . }}
