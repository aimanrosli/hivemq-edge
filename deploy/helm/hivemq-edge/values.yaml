replicaCount: 1

image:
  repository: artifactory.local:8082/docker-local/hivemq-edge
  tag: latest
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: artifactory-registry-key

service:
  type: ClusterIP
  mqttPort: 1883
  httpPort: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

vault:
  enabled: true
  secretName: hivemq-edge-auth
  secretKey: admin-password

monitoring:
  enabled: true
  serviceMonitor:
    interval: 15s
    path: /metrics
