apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hivemq-edge
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'http://gitea.local:3000/iot-ops/hivemq-edge-gitops.git'
    targetRevision: HEAD
    path: deploy/helm/hivemq-edge
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: hivemq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
